resilience4j:
  circuitbreaker:
    instances:
      stripeApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      stripeApi:
        max-attempts: 3
        wait-duration: 1000ms

logging:
