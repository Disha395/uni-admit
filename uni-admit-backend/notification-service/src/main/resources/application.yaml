server:
  port: 8086

spring:
  application:
    name: notification-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
          multiplier: 2.0
          max-interval: 2000ms

  # Mail config — using Gmail SMTP for demo
  # Replace with your actual Gmail + App Password
  mail:
    host: smtp.gmail.com
    port: 587
    username: dishanayak395@gmail.com
    password: bqre hamh jsdn ltri    # Gmail App Password, not your account password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
