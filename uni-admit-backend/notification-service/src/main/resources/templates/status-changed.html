<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Application Status Update</title></head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
<h2 style="color: #1E3A5F;">Application Status Update</h2>
<p>Your application status has been updated.</p>
<table style="border-collapse: collapse; width: 100%;">
    <tr>
        <td style="padding: 8px; font-weight: bold;">Application ID:</td>
        <td style="padding: 8px;" th:text="${applicationId}"></td>
    </tr>
    <tr>
        <td style="padding: 8px; font-weight: bold;">Course:</td>
        <td style="padding: 8px;" th:text="${courseName}"></td>
    </tr>
    <tr>
        <td style="padding: 8px; font-weight: bold;">Previous Status:</td>
        <td style="padding: 8px;" th:text="${oldStatus}"></td>
    </tr>
    <tr>
        <td style="padding: 8px; font-weight: bold;">New Status:</td>
        <td style="padding: 8px; font-weight: bold; color: #1A7A4A;" th:text="${newStatus}"></td>
    </tr>
</table>
<p style="margin-top: 20px;">Log in to your UniAdmit portal to view more details.</p>
<p style="color: #666;">— UniAdmit Team</p>
</body>
</html>
